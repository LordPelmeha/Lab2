<!DOCTYPE html>
<html>
<head>
    <title>MiniMaple</title>
    <meta charset="UTF-8"/>
    <style>
        #container > * { margin: 6px 0; display: block; }
        #result { min-height: 1.2em; padding: 6px; border: 1px dashed #aaa; }
    </style>
</head>
<body>
    <h1>MiniMaple - Symbolic Differentiation</h1>
    <div id="container">
        <input type="text" id="expressionInput" placeholder="e.g. 4*x^3" />
        <input type="text" id="variableInput" placeholder="e.g. x" />
        <button id="diffButton">Differentiate</button>
        <div id="result"></div>
    </div>
    <script src="src/miniMaple.js"></script>
    <script src="src/index.js"></script>
</body>
</html>
